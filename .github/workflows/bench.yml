name: benchmark
on:
  pull_request:
    branches: [main]
jobs:
  hash-chain-bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt pydantic_settings pytest pytest-benchmark
      - run: pytest tests/test_hash_chain_bench.py --benchmark-only --benchmark-json=benchmarks-ci.json
      - uses: actions/upload-artifact@v4
        with:
          name: benchmarks
          path: benchmarks-ci.json
