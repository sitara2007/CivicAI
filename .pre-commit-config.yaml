repos:
  # 1. General file hygiene (Applies to all files)
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-merge-conflict

  # 2. Python (Backend)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.4
    hooks:
      - id: ruff
        args: [ --fix ]
      - id: ruff-format

  # 3. Go (Ingestion Service)
  - repo: https://github.com/dnephin/pre-commit-golang
    rev: v0.5.1
    hooks:
      - id: go-fmt
      - id: go-build
  - repo: local
    hooks:
      - id: go-vet
        name: go-vet (cmd/ingest)
        entry: bash -c "cd cmd/ingest && go vet ./..."
        language: system
        files: \.go$
