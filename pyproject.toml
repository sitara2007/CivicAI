[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "civicos"
version = "0.1.0"
description = "RAG-based government document assistant API."
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.29",
    "celery>=5.4",
    "fastapi>=0.115",
    "openai>=1.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "pypdf>=4.0",
    "pybreaker>=1.0",
    "sqlalchemy[asyncio]>=2.0",
    "tenacity>=8.2",
    "uvicorn[standard]>=0.30",
    "uuid6>=2024.1.12",
    "numpy>=2.5.4",
]

[project.optional-dependencies]
rag = [
    "qdrant-client>=1.9",
    "sentence-transformers>=3.0",
    "torch>=2.2.0",
]
dev = [
    "httpx>=0.27",
    "numpy>=1.26",
    "pytest>=8.0,<9.0.0",
    "pytest-asyncio>=0.23",
    "pytest-benchmark>=4.0",
    "qdrant-client>=1.9",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["cmd*", "data*", "eval*", "frontend*", "internal*", "schema*", "CivicOs*", "scripts*"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "benchmark: marks tests as benchmarks (deselect with '-m \"not benchmark\"')",
]

[dependency-groups]
dev = [
    "ruff>=0.17.3",
]
[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
# B008: FastAPI Depends() is standard, ignore it.
# BLE001: We need broad exception handling for fallback mechanisms.
# ASYNC230: Temp fix until aiofiles is implemented.
ignore = ["B008", "BLE001", "ASYNC230"]
